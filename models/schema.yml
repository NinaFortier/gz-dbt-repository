version: 2
sources:
  - name: raw # allias de la table
    schema: gz_raw_data #Nom exact du dataset dans BQ
    description: greenwez raw data source
    tables:
      - name: sales # allias de la table
        identifier: raw_gz_sales #Nom exact de la table dans BQ
        description: sales of greewneez / we have one row per product_id found in each order_id
        columns:
          - name: "(orders_id || '-' || pdt_id)"
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: product
        identifier: raw_gz_product
        description: purchSE_PRICE by products_id
        columns:
          - name: products_id
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: ship
        identifier: raw_gz_ship
        description: purchSE_PRICE by products_id
        columns:
          - name: orders_id
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: adwords
        identifier: raw_gz_adwords
        description: purchSE_PRICE by products_id
        columns:
          - name: "(date_date || '-' || campaign_key)"
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: bing
        identifier: raw_gz_bing
        description: purchSE_PRICE by products_id
        columns:
          - name: "(date_date || '-' || campaign_key)"
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: criteo
        identifier: raw_gz_criteo
        description: purchSE_PRICE by products_id
        columns:
          - name: "(date_date || '-' || campaign_key)"
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: facebook
        identifier:  raw_gz_facebook
        description: purchSE_PRICE by products_id
        columns:
          - name: "(date_date || '-' || campaign_key)"
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: int_campaigns
        identifier:  int_campaigns
        description: int_campaign 
        columns:
          - name: impressions
            description: primary key of the table
            tests:
              - unique
              - not_null
      - name: int_campaigns_day
        identifier:  int_campaigns_day
        description: int_campaign 
        columns:
          - name: impressions
            tests:
              - not_null
          - name: click
            tests:
              - not_null
          - name: ads_cost
            tests:
              - not_null
